<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    color: #111;
    font-family: Arial, sans-serif;
  }

  .game {
    width: min(90vw, 420px);
    text-align: center;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 32px;
    font-weight: 700;
  }

  .subtitle {
    margin-bottom: 24px;
    color: #666;
    font-size: 14px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 22px;
    font-size: 14px;
  }

  .stats strong {
    display: block;
    margin-top: 4px;
    font-size: 22px;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: min(80vw, 320px);
    aspect-ratio: 1;
    margin: 0 auto 24px;
  }

  .pad {
    border: 3px solid #111;
    background: #fff;
    border-radius: 18px;
    cursor: pointer;
    transition:
      background 0.08s,
      transform 0.08s;
    -webkit-tap-highlight-color: transparent;
  }

  .pad:hover {
    background: #f2f2f2;
  }

  .pad.active {
    background: #111;
    transform: scale(0.96);
  }

  .pad:disabled {
    cursor: default;
  }

  .status {
    height: 22px;
    margin-bottom: 16px;
    font-size: 14px;
    color: #555;
  }

  button.start {
    padding: 11px 26px;
    border: 2px solid #111;
    border-radius: 8px;
    background: #111;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }

  button.start:hover {
    background: #333;
  }

  .hint {
    margin-top: 18px;
    color: #888;
    font-size: 12px;
  }
</style>
</head>

<body>

<div class="game">
  <h1>Simon</h1>
  <div class="subtitle">Repeat the pattern</div>

  <div class="stats">
    <div>
      ROUND
      <strong id="round">0</strong>
    </div>

    <div>
      BEST
      <strong id="best">0</strong>
    </div>
  </div>

  <div class="board">
    <button class="pad" data-id="0" aria-label="Pad 1"></button>
    <button class="pad" data-id="1" aria-label="Pad 2"></button>
    <button class="pad" data-id="2" aria-label="Pad 3"></button>
    <button class="pad" data-id="3" aria-label="Pad 4"></button>
  </div>

  <div class="status" id="status">Press Start</div>

  <button class="start" id="start">Start</button>

  <div class="hint">Press R to restart</div>
</div>

<script>
  const pads = [...document.querySelectorAll(".pad")];
  const roundEl = document.getElementById("round");
  const bestEl = document.getElementById("best");
  const statusEl = document.getElementById("status");
  const startBtn = document.getElementById("start");

  let sequence = [];
  let playerIndex = 0;
  let round = 0;
  let acceptingInput = false;
  let gameRunning = false;

  let best = Number(localStorage.getItem("simonBest")) || 0;
  bestEl.textContent = best;

  let audioContext = null;

  const frequencies = [
    261.63,
    329.63,
    392.00,
    523.25
  ];

  function initAudio() {
    if (!audioContext) {
      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }
  }

  function playTone(id, duration = 180) {
    initAudio();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = frequencies[id];
    oscillator.type = "sine";

    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.18,
      audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime + duration / 1000
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(
      audioContext.currentTime + duration / 1000 + 0.02
    );
  }

  function flashPad(id, duration = 300) {
    return new Promise(resolve => {
      const pad = pads[id];

      pad.classList.add("active");
      playTone(id, duration);

      setTimeout(() => {
        pad.classList.remove("active");

        setTimeout(resolve, 80);
      }, duration);
    });
  }

  async function showSequence() {
    acceptingInput = false;

    statusEl.textContent = "Watch...";

    await new Promise(resolve => setTimeout(resolve, 500));

    for (const id of sequence) {
      await flashPad(id, 300);
    }

    playerIndex = 0;
    acceptingInput = true;
    statusEl.textContent = "Your turn";
  }

  function nextRound() {
    round++;

    roundEl.textContent = round;

    sequence.push(
      Math.floor(Math.random() * 4)
    );

    showSequence();
  }

  function startGame() {
    initAudio();

    sequence = [];
    playerIndex = 0;
    round = 0;
    gameRunning = true;
    acceptingInput = false;

    roundEl.textContent = "0";
    statusEl.textContent = "Get ready...";

    nextRound();
  }

  function gameOver() {
    acceptingInput = false;
    gameRunning = false;

    if (round > best) {
      best = round;
      bestEl.textContent = best;
      localStorage.setItem("simonBest", best);
    }

    statusEl.textContent =
      `Game over — you reached round ${round}`;

    pads.forEach(pad => {
      pad.classList.add("active");
    });

    setTimeout(() => {
      pads.forEach(pad => {
        pad.classList.remove("active");
      });
    }, 180);
  }

  function handlePad(id) {
    if (!acceptingInput || !gameRunning) {
      return;
    }

    flashPad(id, 130);

    if (id !== sequence[playerIndex]) {
      gameOver();
      return;
    }

    playerIndex++;

    if (playerIndex === sequence.length) {
      acceptingInput = false;

      statusEl.textContent = "Correct!";

      setTimeout(() => {
        nextRound();
      }, 650);
    }
  }

  pads.forEach(pad => {
    pad.addEventListener("click", () => {
      handlePad(Number(pad.dataset.id));
    });
  });

  startBtn.addEventListener("click", startGame);

  document.addEventListener("keydown", event => {
    if (event.key.toLowerCase() === "r") {
      startGame();
    }

    if (!gameRunning) {
      return;
    }

    const keys = {
      "1": 0,
      "2": 1,
      "3": 2,
      "4": 3
    };

    if (keys[event.key] !== undefined) {
      handlePad(keys[event.key]);
    }
  });
</script>

</body>
</html>
