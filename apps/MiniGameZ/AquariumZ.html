<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQUARIUM</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --black: #111;
  --white: #fff;
  --gray: #888;
  --light: #eee;
  --green: #2f8f46;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fff;
  color: var(--black);
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.game {
  width: min(92vw, 620px);
  padding: 24px 0;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 14px;
}

h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: .08em;
}

.money {
  font-size: 20px;
  font-variant-numeric: tabular-nums;
}

.money span {
  font-weight: bold;
}

/* AQUARIUM */

.tank {
  position: relative;
  width: 100%;
  aspect-ratio: 1.7 / 1;
  border: 2px solid var(--black);
  overflow: hidden;
  background: linear-gradient(
    to bottom,
    #fff 0%,
    #fff 76%,
    #f0f0f0 76%,
    #f0f0f0 100%
  );
}

.water-line {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 24%;
  border-top: 1px solid #ccc;
}

.sand {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 24%;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 18px,
      rgba(0,0,0,.025) 18px 19px
    ),
    #f0f0f0;
}

.tank-info {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 10px;
  color: var(--gray);
  letter-spacing: .08em;
}

/* PLANTS */

.plant {
  position: absolute;
  bottom: 18%;
  width: 4px;
  background: var(--black);
  transform-origin: bottom;
}

.plant::before,
.plant::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 3px;
  background: var(--black);
  border-radius: 50%;
}

.plant::before {
  left: -18px;
  top: 25%;
  transform: rotate(-35deg);
}

.plant::after {
  left: 0;
  top: 48%;
  transform: rotate(35deg);
}

/* ROCKS */

.rock {
  position: absolute;
  bottom: 16%;
  width: 34px;
  height: 18px;
  border: 2px solid var(--black);
  border-radius: 60% 60% 35% 35%;
  background: white;
}

/* FISH */

.fish {
  position: absolute;
  width: 40px;
  height: 22px;
  pointer-events: none;
}

.fish-body {
  position: absolute;
  left: 8px;
  top: 2px;
  width: 27px;
  height: 18px;
  border: 2px solid var(--black);
  border-radius: 55%;
  background: white;
}

.fish-tail {
  position: absolute;
  left: 0;
  top: 4px;
  width: 0;
  height: 0;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-right: 11px solid var(--black);
}

.fish-eye {
  position: absolute;
  right: 6px;
  top: 8px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--black);
}

.fish.goldfish .fish-body {
  border-width: 3px;
}

.bubble {
  position: absolute;
  width: 5px;
  height: 5px;
  border: 1px solid #aaa;
  border-radius: 50%;
  animation: bubble 4s linear infinite;
}

@keyframes bubble {
  0% {
    transform: translateY(0);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  100% {
    transform: translateY(-90px);
    opacity: 0;
  }
}

/* STATS */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 2px solid var(--black);
  border-top: 0;
}

.stat {
  padding: 10px;
  border-right: 1px solid var(--black);
}

.stat:last-child {
  border-right: 0;
}

.stat-label {
  font-size: 10px;
  color: var(--gray);
  letter-spacing: .08em;
}

.stat-value {
  margin-top: 3px;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}

/* SHOP */

.section-title {
  margin: 22px 0 8px;
  font-size: 10px;
  color: var(--gray);
  letter-spacing: .1em;
}

.shop {
  display: grid;
  gap: 7px;
}

button {
  font: inherit;
  color: var(--black);
  background: white;
  border: 1px solid var(--black);
  cursor: pointer;
}

button:hover:not(:disabled) {
  background: var(--black);
  color: white;
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

button:disabled {
  color: #aaa;
  border-color: #ccc;
  cursor: not-allowed;
}

.shop-item {
  width: 100%;
  min-height: 58px;
  padding: 9px 11px;
  display: grid;
  grid-template-columns: 1fr auto;
  text-align: left;
  align-items: center;
}

.item-name {
  font-size: 13px;
  font-weight: bold;
  letter-spacing: .04em;
}

.item-description {
  margin-top: 3px;
  font-size: 11px;
  color: var(--gray);
}

.item-price {
  text-align: right;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.item-owned {
  margin-top: 3px;
  font-size: 10px;
  color: var(--gray);
}

.milestone {
  margin-top: 16px;
  padding: 11px;
  border: 1px solid #ccc;
  text-align: center;
  font-size: 11px;
  color: var(--gray);
}

.controls {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.controls button {
  flex: 1;
  padding: 10px;
  font-size: 10px;
  letter-spacing: .08em;
}

.hint {
  margin-top: 12px;
  text-align: center;
  font-size: 10px;
  color: #999;
}

@media (max-width: 480px) {
  .game {
    width: 94vw;
  }

  h1 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<main class="game">

  <header>
    <h1>AQUARIUM</h1>
    <div class="money">◉ <span id="money">50</span></div>
  </header>

  <section class="tank" id="tank">

    <div class="tank-info">
      AQUARIUM LV <span id="tankLevel">1</span>
    </div>

    <div class="water-line"></div>
    <div class="sand"></div>

    <div class="plant" style="left:18%; height:48px;"></div>
    <div class="plant" style="left:23%; height:34px; transform:scale(.8);"></div>
    <div class="plant" style="left:76%; height:42px;"></div>

    <div class="rock" style="left:42%;"></div>
    <div class="rock" style="left:68%; transform:scale(.75);"></div>

    <div class="bubble" style="left:27%; bottom:25%;"></div>
    <div class="bubble" style="left:29%; bottom:27%; animation-delay:1.2s;"></div>
    <div class="bubble" style="left:73%; bottom:25%; animation-delay:2s;"></div>

    <div id="fishContainer"></div>

  </section>

  <section class="stats">

    <div class="stat">
      <div class="stat-label">FISH</div>
      <div class="stat-value">
        <span id="fishCount">0 / 3</span>
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">INCOME</div>
      <div class="stat-value">
        ◉ <span id="income">0</span>/s
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">TANK</div>
      <div class="stat-value">
        LV <span id="level">1</span>
      </div>
    </div>

  </section>

  <div class="section-title">LIFE</div>

  <section class="shop">

    <button class="shop-item" id="buyGuppy">
      <div>
        <div class="item-name">GUPPY</div>
        <div class="item-description">
          A small, friendly fish.
        </div>
      </div>

      <div class="item-price">
        ◉ <span id="guppyCost">25</span>
        <div class="item-owned">
          OWNED <span id="guppyOwned">0</span>
        </div>
      </div>
    </button>

    <button class="shop-item" id="buyGoldfish">
      <div>
        <div class="item-name">GOLDFISH</div>
        <div class="item-description">
          Generates more income.
        </div>
      </div>

      <div class="item-price">
        ◉ <span id="goldfishCost">100</span>
        <div class="item-owned">
          OWNED <span id="goldfishOwned">0</span>
        </div>
      </div>
    </button>

    <button class="shop-item" id="buyPlant">
      <div>
        <div class="item-name">PLANT</div>
        <div class="item-description">
          Adds a little life to the tank.
        </div>
      </div>

      <div class="item-price">
        ◉ <span id="plantCost">75</span>
        <div class="item-owned">
          OWNED <span id="plantOwned">0</span>
        </div>
      </div>
    </button>

    <button class="shop-item" id="buyTank">
      <div>
        <div class="item-name">LARGER TANK</div>
        <div class="item-description">
          Increase fish capacity by 2.
        </div>
      </div>

      <div class="item-price">
        ◉ <span id="tankCost">300</span>
        <div class="item-owned">
          CAPACITY +2
        </div>
      </div>
    </button>

  </section>

  <div class="milestone" id="milestone">
    Buy your first fish.
  </div>

  <div class="controls">
    <button id="saveButton">SAVE</button>
    <button id="resetButton">NEW AQUARIUM</button>
  </div>

  <div class="hint">
    Your fish generate income automatically · R to restart
  </div>

</main>

<script>
const SAVE_KEY = "aquariumSave";

let state = {
  money: 50,
  guppy: 0,
  goldfish: 0,
  plants: 0,
  tankLevel: 1,
  totalEarned: 0
};

const FISH = {
  guppy: {
    baseCost: 25,
    income: 1
  },

  goldfish: {
    baseCost: 100,
    income: 5
  }
};

const moneyEl = document.getElementById("money");
const fishCountEl = document.getElementById("fishCount");
const incomeEl = document.getElementById("income");
const levelEl = document.getElementById("level");
const tankLevelEl = document.getElementById("tankLevel");

const guppyCostEl = document.getElementById("guppyCost");
const goldfishCostEl = document.getElementById("goldfishCost");
const plantCostEl = document.getElementById("plantCost");

const guppyOwnedEl = document.getElementById("guppyOwned");
const goldfishOwnedEl = document.getElementById("goldfishOwned");
const plantOwnedEl = document.getElementById("plantOwned");

const buyGuppy = document.getElementById("buyGuppy");
const buyGoldfish = document.getElementById("buyGoldfish");
const buyPlant = document.getElementById("buyPlant");
const buyTank = document.getElementById("buyTank");

const tank = document.getElementById("tank");
const fishContainer = document.getElementById("fishContainer");
const milestone = document.getElementById("milestone");

let fishVisuals = [];

/* ---------- ECONOMY ---------- */

function guppyCost() {
  return Math.floor(
    FISH.guppy.baseCost *
    Math.pow(1.18, state.guppy)
  );
}

function goldfishCost() {
  return Math.floor(
    FISH.goldfish.baseCost *
    Math.pow(1.22, state.goldfish)
  );
}

function plantCost() {
  return Math.floor(
    75 * Math.pow(1.25, state.plants)
  );
}

function tankCost() {
  return Math.floor(
    300 * Math.pow(2, state.tankLevel - 1)
  );
}

function capacity() {
  return 1 + state.tankLevel * 2;
}

function fishCount() {
  return state.guppy + state.goldfish;
}

function incomePerSecond() {
  return (
    state.guppy * FISH.guppy.income +
    state.goldfish * FISH.goldfish.income
  );
}

function formatNumber(value) {
  if (value < 1000) {
    return Math.floor(value);
  }

  if (value < 1000000) {
    return (value / 1000).toFixed(1) + "K";
  }

  if (value < 1000000000) {
    return (value / 1000000).toFixed(1) + "M";
  }

  return (value / 1000000000).toFixed(1) + "B";
}

/* ---------- RENDER ---------- */

function render() {

  moneyEl.textContent = formatNumber(state.money);

  fishCountEl.textContent =
    `${fishCount()} / ${capacity()}`;

  incomeEl.textContent =
    formatNumber(incomePerSecond());

  levelEl.textContent = state.tankLevel;
  tankLevelEl.textContent = state.tankLevel;

  guppyCostEl.textContent =
    formatNumber(guppyCost());

  goldfishCostEl.textContent =
    formatNumber(goldfishCost());

  plantCostEl.textContent =
    formatNumber(plantCost());

  guppyOwnedEl.textContent = state.guppy;
  goldfishOwnedEl.textContent = state.goldfish;
  plantOwnedEl.textContent = state.plants;

  buyGuppy.disabled =
    state.money < guppyCost() ||
    fishCount() >= capacity();

  buyGoldfish.disabled =
    state.money < goldfishCost() ||
    fishCount() >= capacity();

  buyPlant.disabled =
    state.money < plantCost();

  buyTank.disabled =
    state.money < tankCost();

  updateMilestone();
}

/* ---------- BUY FISH ---------- */

buyGuppy.addEventListener("click", () => {

  const cost = guppyCost();

  if (state.money < cost) return;
  if (fishCount() >= capacity()) return;

  state.money -= cost;
  state.guppy++;

  createFish("guppy");

  save();
  render();
});

buyGoldfish.addEventListener("click", () => {

  const cost = goldfishCost();

  if (state.money < cost) return;
  if (fishCount() >= capacity()) return;

  state.money -= cost;
  state.goldfish++;

  createFish("goldfish");

  save();
  render();
});

/* ---------- PLANTS ---------- */

buyPlant.addEventListener("click", () => {

  const cost = plantCost();

  if (state.money < cost) return;

  state.money -= cost;
  state.plants++;

  createPlant();

  save();
  render();
});

/* ---------- TANK ---------- */

buyTank.addEventListener("click", () => {

  const cost = tankCost();

  if (state.money < cost) return;

  state.money -= cost;
  state.tankLevel++;

  save();
  render();
});

/* ---------- FISH VISUALS ---------- */

function createFish(type) {

  const fish = document.createElement("div");

  fish.className =
    `fish ${type}`;

  fish.innerHTML = `
    <div class="fish-tail"></div>
    <div class="fish-body"></div>
    <div class="fish-eye"></div>
  `;

  fishContainer.appendChild(fish);

  const visual = {
    element: fish,
    x: 10 + Math.random() * 75,
    y: 20 + Math.random() * 40,
    direction: Math.random() > .5 ? 1 : -1,
    speed: .012 + Math.random() * .018
  };

  fishVisuals.push(visual);

  positionFish(visual);
}

function positionFish(fish) {

  fish.element.style.left =
    fish.x + "%";

  fish.element.style.top =
    fish.y + "%";

  fish.element.style.transform =
    `scaleX(${fish.direction})`;
}

function animateFish() {

  for (const fish of fishVisuals) {

    fish.x +=
      fish.speed * fish.direction;

    if (fish.x > 84) {
      fish.direction = -1;
    }

    if (fish.x < 6) {
      fish.direction = 1;
    }

    positionFish(fish);
  }

  requestAnimationFrame(animateFish);
}

animateFish();

/* ---------- PLANTS ---------- */

function createPlant() {

  const plant =
    document.createElement("div");

  plant.className = "plant";

  plant.style.left =
    (8 + Math.random() * 84) + "%";

  plant.style.height =
    (25 + Math.random() * 35) + "px";

  tank.appendChild(plant);
}

/* ---------- MILESTONES ---------- */

function updateMilestone() {

  if (state.totalEarned >= 100000) {

    milestone.textContent =
      "Your aquarium has become an ecosystem.";

  } else if (state.totalEarned >= 25000) {

    milestone.textContent =
      "The aquarium is thriving.";

  } else if (state.totalEarned >= 5000) {

    milestone.textContent =
      "Your little ecosystem is growing.";

  } else if (state.totalEarned >= 1000) {

    milestone.textContent =
      "Your aquarium is starting to feel alive.";

  } else if (fishCount() >= capacity()) {

    milestone.textContent =
      "The tank is full. Time for a larger tank.";

  } else if (fishCount() > 0) {

    milestone.textContent =
      "Your fish are happily swimming around.";

  } else {

    milestone.textContent =
      "Buy your first fish.";
  }
}

/* ---------- PASSIVE INCOME ---------- */

setInterval(() => {

  const income =
    incomePerSecond();

  if (income <= 0) return;

  state.money += income;
  state.totalEarned += income;

  render();

}, 1000);

/* ---------- SAVE ---------- */

function save() {

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(state)
  );
}

function load() {

  try {

    const saved =
      localStorage.getItem(SAVE_KEY);

    if (!saved) return;

    const parsed =
      JSON.parse(saved);

    state = {
      ...state,
      ...parsed
    };

  } catch {

    console.warn(
      "Could not load aquarium save."
    );
  }
}

document
  .getElementById("saveButton")
  .addEventListener("click", () => {

    save();

    const button =
      document.getElementById("saveButton");

    button.textContent = "SAVED";

    setTimeout(() => {
      button.textContent = "SAVE";
    }, 700);
  });

/* ---------- RESET ---------- */

function resetGame() {

  if (!confirm("Start a new aquarium?")) {
    return;
  }

  localStorage.removeItem(SAVE_KEY);

  state = {
    money: 50,
    guppy: 0,
    goldfish: 0,
    plants: 0,
    tankLevel: 1,
    totalEarned: 0
  };

  fishVisuals = [];
  fishContainer.innerHTML = "";

  /*
    Remove purchased plants.
    Keep the three starting plants.
  */

  const plants =
    tank.querySelectorAll(".plant");

  plants.forEach((plant, index) => {

    if (index >= 3) {
      plant.remove();
    }
  });

  render();
}

document
  .getElementById("resetButton")
  .addEventListener("click", resetGame);

/* ---------- R TO RESTART ---------- */

document.addEventListener("keydown", event => {

  if (
    event.target.tagName === "INPUT" ||
    event.target.tagName === "TEXTAREA"
  ) {
    return;
  }

  if (event.key.toLowerCase() === "r") {
    resetGame();
  }
});

/* ---------- REBUILD SAVED FISH ---------- */

function rebuildFish() {

  fishVisuals = [];
  fishContainer.innerHTML = "";

  for (let i = 0; i < state.guppy; i++) {
    createFish("guppy");
  }

  for (let i = 0; i < state.goldfish; i++) {
    createFish("goldfish");
  }
}

function rebuildPlants() {

  /*
    Three plants are built into the aquarium.
    Add only purchased plants.
  */

  for (let i = 0; i < state.plants; i++) {
    createPlant();
  }
}

/* ---------- START ---------- */

load();
rebuildFish();
rebuildPlants();
render();

</script>

</body>
</html>
