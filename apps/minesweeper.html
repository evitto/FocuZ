<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINES</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='13' r='6' fill='%23111'/%3E%3Cg stroke='%23111' stroke-width='1.6' stroke-linecap='round'%3E%3Cline x1='12' y1='3' x2='12' y2='6'/%3E%3Cline x1='4.5' y1='7' x2='6.7' y2='8.6'/%3E%3Cline x1='19.5' y1='7' x2='17.3' y2='8.6'/%3E%3Cline x1='3.2' y1='13' x2='6' y2='13'/%3E%3Cline x1='20.8' y1='13' x2='18' y2='13'/%3E%3C/g%3E%3C/svg%3E">

  <style>
    :root {
      --background: #ffffff;
      --foreground: #111;
      --muted: #777;
      --cell: #fff;
      --revealed: #e9e9e9;
      --border: #111;
      --success: #2f8f46;
    }

    * {
      box-sizing: border-box;
    }

    .focuz-return {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      text-decoration: none;
      transition: background 120ms ease, color 120ms ease;
    }

    .focuz-return:hover {
      background: var(--foreground);
      color: var(--background);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--foreground);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .game {
      width: min(92vw, 520px);
      text-align: center;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .counter,
    .timer {
      min-width: 42px;
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      text-align: right;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      grid-template-rows: repeat(10, minmax(0, 1fr));

      width: 100%;
      aspect-ratio: 1 / 1;

      gap: 1px;
      padding: 0;

      background: var(--border);
      border: 2px solid var(--border);

      overflow: hidden;
      user-select: none;
    }

    .cell {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;

      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;

      background: var(--cell);
      color: var(--foreground);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-family: inherit;
      font-size: clamp(11px, 3.5vw, 18px);
      font-weight: 800;
      line-height: 1;

      cursor: pointer;

      transition:
        background 100ms ease,
        transform 100ms ease;
    }

    .cell:hover:not(.revealed) {
      background: #ededed;
    }

    .cell:active:not(.revealed) {
      transform: scale(0.94);
    }

    .cell.revealed {
      background: var(--revealed);
      cursor: default;
    }

    .cell.flagged {
      font-size: clamp(12px, 3.2vw, 17px);
    }

    .cell.mine {
      background: #111;
      color: #fff;
    }

    .cell.correct-flag {
      background: var(--success);
      color: #fff;
    }

    .cell.wrong-flag {
      background: #888;
      color: #fff;
    }

    .number-1 {
      color: #111;
    }

    .number-2 {
      color: #444;
    }

    .number-3 {
      color: #666;
    }

    .number-4,
    .number-5,
    .number-6,
    .number-7,
    .number-8 {
      color: #000;
    }

    .status {
      height: 24px;
      margin-top: 15px;

      color: var(--muted);

      font-size: 13px;
      line-height: 24px;
      letter-spacing: 0.03em;
    }

    .restart {
      margin-top: 12px;
      padding: 9px 18px;

      border: 1px solid var(--foreground);

      background: transparent;
      color: var(--foreground);

      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;

      cursor: pointer;

      transition:
        background 120ms ease,
        color 120ms ease;
    }

    .restart:hover {
      background: var(--foreground);
      color: var(--background);
    }

    .hint {
      margin-top: 13px;

      color: var(--muted);

      font-size: 11px;
      line-height: 1.4;
    }

    @media (max-width: 420px) {
      .game {
        width: 94vw;
      }

      h1 {
        font-size: 18px;
      }

      .stats {
        gap: 12px;
      }

      .counter,
      .timer {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <a class="focuz-return" href="../index.html" aria-label="Back to FocuZ">← FocuZ</a>

  <main class="game">

    <header>
      <h1>MINES</h1>

      <div class="stats">
        <div
          class="counter"
          id="counter"
          aria-label="Mines remaining"
        >010</div>

        <div
          class="timer"
          id="timer"
          aria-label="Time"
        >000</div>
      </div>
    </header>

    <div
      class="board"
      id="board"
      aria-label="Minesweeper game board"
    ></div>

    <div
      class="status"
      id="status"
      aria-live="polite"
    >
      Make your first move.
    </div>

    <button
      class="restart"
      id="restart"
      type="button"
    >
      NEW GAME
    </button>

    <div class="hint">
      Left click to reveal · Right click to flag · R to restart
    </div>

  </main>

  <script>
    const SIZE = 10;
    const MINES = 10;

    const boardElement = document.getElementById("board");
    const counterElement = document.getElementById("counter");
    const timerElement = document.getElementById("timer");
    const statusElement = document.getElementById("status");
    const restartButton = document.getElementById("restart");

    let board = [];

    let gameOver = false;
    let flags = 0;
    let revealed = 0;
    let firstClick = true;

    // Timer state
    let timer = 0;
    let timerInterval = null;


    function createGame() {
      // Reset game
      board = [];
      gameOver = false;
      flags = 0;
      revealed = 0;
      firstClick = true;

      // Reset timer
      stopTimer();
      timer = 0;
      updateTimer();

      statusElement.textContent = "Make your first move.";

      updateCounter();

      // Create empty board
      for (let row = 0; row < SIZE; row++) {
        board[row] = [];

        for (let col = 0; col < SIZE; col++) {
          board[row][col] = {
            mine: false,
            revealed: false,
            flagged: false,
            adjacent: 0
          };
        }
      }

      render();
    }


    function startTimer() {
      // Prevent multiple timers from running
      if (timerInterval !== null) {
        return;
      }

      timerInterval = setInterval(() => {
        timer++;

        // Keep display at 999 maximum
        if (timer > 999) {
          timer = 999;
        }

        updateTimer();
      }, 1000);
    }


    function stopTimer() {
      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }


    function updateTimer() {
      timerElement.textContent = String(timer).padStart(3, "0");
    }


    function placeMines(safeRow, safeCol) {
      let placed = 0;

      while (placed < MINES) {
        const row = Math.floor(Math.random() * SIZE);
        const col = Math.floor(Math.random() * SIZE);

        // First clicked cell is always safe
        if (row === safeRow && col === safeCol) {
          continue;
        }

        if (!board[row][col].mine) {
          board[row][col].mine = true;
          placed++;
        }
      }

      calculateNumbers();
    }


    function calculateNumbers() {
      for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {

          if (!board[row][col].mine) {
            board[row][col].adjacent =
              countAdjacentMines(row, col);
          }

        }
      }
    }


    function countAdjacentMines(row, col) {
      let count = 0;

      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {

          if (dr === 0 && dc === 0) {
            continue;
          }

          const r = row + dr;
          const c = col + dc;

          if (isInside(r, c) && board[r][c].mine) {
            count++;
          }

        }
      }

      return count;
    }


    function isInside(row, col) {
      return (
        row >= 0 &&
        row < SIZE &&
        col >= 0 &&
        col < SIZE
      );
    }


    function render() {
      boardElement.innerHTML = "";

      for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {

          const cell = board[row][col];

          const element = document.createElement("button");

          element.type = "button";
          element.className = "cell";

          element.setAttribute(
            "aria-label",
            `Row ${row + 1}, Column ${col + 1}`
          );


          // Game over display
          if (gameOver) {

            // Correctly flagged mine
            if (cell.mine && cell.flagged) {

              element.classList.add("correct-flag");
              element.textContent = "⚑";

            }

            // Wrong flag
            else if (!cell.mine && cell.flagged) {

              element.classList.add("wrong-flag");
              element.textContent = "⚑";

            }

            // Unflagged mine
            else if (cell.mine) {

              element.classList.add("mine");
              element.textContent = "×";

            }

            // Revealed safe cell
            else if (cell.revealed) {

              element.classList.add("revealed");

              if (cell.adjacent > 0) {
                element.classList.add(
                  `number-${cell.adjacent}`
                );

                element.textContent = cell.adjacent;
              }

            }

          }


          // Normal game display
          else {

            // Revealed cell
            if (cell.revealed) {

              element.classList.add("revealed");

              if (cell.mine) {

                element.classList.add("mine");
                element.textContent = "×";

              }

              else if (cell.adjacent > 0) {

                element.classList.add(
                  `number-${cell.adjacent}`
                );

                element.textContent = cell.adjacent;
              }

            }

            // Flagged cell
            else if (cell.flagged) {

              element.classList.add("flagged");
              element.textContent = "⚑";

            }

          }


          // Left click
          element.addEventListener("click", () => {
            reveal(row, col);
          });


          // Right click
          element.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            toggleFlag(row, col);
          });


          boardElement.appendChild(element);
        }
      }
    }


    function reveal(row, col) {
      if (gameOver) {
        return;
      }

      const cell = board[row][col];

      // Cannot reveal a revealed or flagged cell
      if (cell.revealed || cell.flagged) {
        return;
      }


      // First valid reveal
      if (firstClick) {

        // Start timer on first actual reveal
        startTimer();

        // Place mines after knowing the first clicked cell
        placeMines(row, col);

        firstClick = false;

        statusElement.textContent = "Clear the field.";
      }


      // Hit a mine
      if (cell.mine) {

        cell.revealed = true;

        gameOver = true;

        stopTimer();

        revealAllMines();

        statusElement.textContent = "Game over.";

        render();

        return;
      }


      // Reveal safe area
      floodReveal(row, col);


      // Check for win
      if (hasWon()) {

        gameOver = true;

        stopTimer();

        // Automatically flag all mines
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {

            if (board[r][c].mine) {
              board[r][c].flagged = true;
            }

          }
        }

        flags = MINES;

        statusElement.textContent = "Field cleared.";

        updateCounter();
      }


      render();
    }


    function floodReveal(startRow, startCol) {
      const queue = [[startRow, startCol]];

      while (queue.length > 0) {

        const [row, col] = queue.shift();

        const cell = board[row][col];

        if (
          cell.revealed ||
          cell.flagged ||
          cell.mine
        ) {
          continue;
        }

        cell.revealed = true;
        revealed++;


        // Automatically expand empty areas
        if (cell.adjacent === 0) {

          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {

              const r = row + dr;
              const c = col + dc;

              if (!isInside(r, c)) {
                continue;
              }

              const neighbor = board[r][c];

              if (
                !neighbor.revealed &&
                !neighbor.flagged &&
                !neighbor.mine
              ) {
                queue.push([r, c]);
              }

            }
          }

        }
      }
    }


    function toggleFlag(row, col) {
      if (gameOver) {
        return;
      }

      const cell = board[row][col];

      // Cannot flag revealed cells
      if (cell.revealed) {
        return;
      }


      // Remove flag
      if (cell.flagged) {

        cell.flagged = false;
        flags--;

      }

      // Add flag
      else {

        // Maximum of 10 flags
        if (flags >= MINES) {
          return;
        }

        cell.flagged = true;
        flags++;
      }


      updateCounter();
      render();
    }


    function revealAllMines() {
      for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {

          if (board[row][col].mine) {
            board[row][col].revealed = true;
          }

        }
      }
    }


    function hasWon() {
      return revealed === SIZE * SIZE - MINES;
    }


    function updateCounter() {
      counterElement.textContent =
        String(MINES - flags).padStart(3, "0");
    }


    // New Game button
    restartButton.addEventListener("click", createGame);


    // R key restarts
    document.addEventListener("keydown", (event) => {

      if (event.key.toLowerCase() !== "r") {
        return;
      }

      if (
        event.target.tagName === "INPUT" ||
        event.target.tagName === "TEXTAREA"
      ) {
        return;
      }

      event.preventDefault();

      createGame();
    });


    // Start the first game
    createGame();
  </script>

</body>
</html>
